[mgr]
cwd = { fg = "#7dcfff" }

find_keyword  = { fg = "#e0af68", bold = true, italic = true, underline = true }
find_position = { fg = "#bb9af7", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7dcfff", bg = "#7dcfff" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }

count_copied   = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut      = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#e0af68" }

border_style = { fg = "#3b4261" }

[tabs]
active   = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
inactive = { fg = "#7aa2f7", bg = "#292e42" }

[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt  = { fg = "#7aa2f7", bg = "#292e42" }
select_main = { fg = "#1a1b26", bg = "#bb9af7", bold = true }
select_alt  = { fg = "#bb9af7", bg = "#292e42" }
unset_main  = { fg = "#1a1b26", bg = "#f7768e", bold = true }
unset_alt   = { fg = "#f7768e", bg = "#292e42" }

[indicator]
parent  = { bg = "#3b4261" }
current = { fg = "#c0caf5", bg = "#3d59a1", bold = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "#3b4261" }
perm_type  = { fg = "#9ece6a" }
perm_read  = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#7dcfff" }

progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error  = { fg = "#e0af68", bg = "#f7768e" }

[which]
border          = { fg = "#27a1b9" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#565f89" }
desc            = { fg = "#bb9af7" }
separator_style = { fg = "#3b4261" }

[confirm]
border = { fg = "#27a1b9" }
title  = { fg = "#7aa2f7" }

[spot]
border   = { fg = "#27a1b9" }
title    = { fg = "#7aa2f7" }
tbl_col  = { fg = "#7aa2f7" }
tbl_cell = { fg = "#e0af68", reversed = true }

[notify]
title_info  = { fg = "#9ece6a" }
title_warn  = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[pick]
border = { fg = "#27a1b9" }
active = { fg = "#bb9af7", bold = true }

[input]
border   = { fg = "#27a1b9" }
selected = { bg = "#283457" }

[cmp]
border = { fg = "#27a1b9" }
active = { bg = "#292e42" }

[tasks]
border  = { fg = "#27a1b9" }
hovered = { fg = "#bb9af7", bold = true }

[help]
border  = { fg = "#27a1b9" }
chord   = { fg = "#7dcfff" }
hovered = { bg = "#292e42", bold = true }

[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "#e0af68" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#bb9af7" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f7768e" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#7dcfff" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#565f89" },
	# Special file
	{ url = "*", is = "orphan", bg = "#f7768e" },
	{ url = "*", is = "exec", fg = "#9ece6a" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "#f7768e" },
	{ url = "*/", is = "dummy", bg = "#f7768e" },
	# Fallback: directories use Helix's ui.text.directory color
	{ url = "*/", fg = "#7dcfff" },
]
